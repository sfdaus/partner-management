name: build-and-deploy
on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner
        id: vars
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.vars.outputs.owner_lc }}/partner-management
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags:   ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Copy k8s manifests to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "k8s/*"
          target: "partner-management"

      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -Eeuo pipefail
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
            
            NS=prakarsa
            APP=partner-management
            OWNER_LC="${{ steps.vars.outputs.owner_lc }}"
            IMAGE="ghcr.io/${OWNER_LC}/${APP}:${{ github.sha }}"
            
            # Dump diagnostik kalau ada error, jangan bikin job "misterius" merah
            trap 'echo "[DIAG] Deploy FAILED"; \
                  kubectl -n $NS get deploy $APP -o wide || true; \
                  kubectl -n $NS get pods -l app=$APP -o wide || true; \
                  POD=$(kubectl -n $NS get pods -l app=$APP --sort-by=.metadata.creationTimestamp -o jsonpath="{.items[-1:].0.metadata.name}" || true); \
                  echo "--- DESCRIBE (events)"; kubectl -n $NS describe pod "$POD" | sed -n "/Events/,\$p" || true; \
                  echo "--- LOGS (tail 200)"; kubectl -n $NS logs "$POD" --tail=200 || true' ERR
            
            echo "[1/4] Apply manifests"
            kubectl -n $NS apply -f ~/partner-management/k8s/
            
            echo "[2/4] Set image -> $IMAGE"
            kubectl -n $NS set image deploy/$APP $APP=$IMAGE
            
            echo "[3/4] Wait rollout"
            kubectl -n $NS rollout status deploy/$APP --timeout=600s
            
            NEW_HASH=$(kubectl -n $NS get deploy/$APP -o jsonpath='{.spec.template.metadata.labels.pod-template-hash}')
            kubectl -n $NS wait --for=condition=Ready pod -l app=$APP,pod-template-hash="$NEW_HASH" --timeout=300s
            
            # (opsional) tunggu pod lama hilang biar bersih, tapi JANGAN gagalkan job kalau telat
            kubectl -n $NS wait --for=delete pod -l app=$APP,pod-template-hash!="$NEW_HASH" --timeout=120s || true
            
            echo "[4/4] Status akhir"
            kubectl -n $NS get deploy/$APP
            kubectl -n $NS get pods -l app=$APP -o wide
            echo "Deploy OK (RS terbaru: $NEW_HASH)"